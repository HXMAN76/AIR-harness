name: air
on:
  push:
    branches: [air/main]
  pull_request:
    branches: [air/main]

jobs:
  air:
    name: air (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            air/pnpm-lock.yaml

      - name: Install fork
        run: pnpm install --frozen-lockfile
      - name: Build fork
        run: pnpm run build

      - name: Install AIR workspace
        run: pnpm -C air install --frozen-lockfile
      - name: Build AIR packages
        working-directory: air
        run: pnpm --filter "./packages/*" --filter "./bundles/*" run --if-present build
      - name: Typecheck AIR packages and scripts
        run: pnpm -C air run typecheck
      - name: Lint AIR packages and scripts
        run: pnpm -C air run lint
      - name: Test AIR workspace
        run: pnpm -C air run test

      - name: Root gates that scan air/
        if: runner.os == 'Linux'
        run: |
          pnpm run verify-no-unknown-casts
          pnpm run verify-concrete-terms
          pnpm run verify-repository-references
          pnpm run verify-translation-pairing

      - name: Compose and boot the AIR profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: pnpm -C air run smoke
