# Screen route: adds the Cua Driver computer-use tools (native SDK in the dsh host) on top of voice.cordis.patch.yml and
# browser.cordis.patch.yml (the Playwright browser tools, shared with the cloud route; see ROUTES in src/core/agent.ts).
# Used only with the Ollama Cloud route (minimax-m3.1-flash has vision), which accepts screenshots.
- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
