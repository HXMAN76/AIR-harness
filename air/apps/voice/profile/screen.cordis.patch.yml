# Screen route: adds the Playwright browser and Cua Driver computer-use tools (native SDK in the dsh host) on top of voice.cordis.patch.yml.
# Used only with the Ollama Cloud route (minimax-m3.1-flash has vision), which accepts screenshots.
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      config:
        mode: launch
        headless: true
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'
