<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'">
  <title>AIR Voice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="orb" aria-hidden="true"></canvas>

  <button class="icon gear" id="gear" aria-label="Settings" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.4-2.2a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>
  </button>
  <div class="top-right">
    <span class="pill" id="pill">Local</span>
    <button class="icon close" id="close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <p class="line" id="line" aria-live="polite"></p>

  <section class="panel" id="panel" hidden>
    <div class="routes" role="group" aria-label="Model route">
      <button class="route" data-route="local">Local</button>
      <button class="route" data-route="cloud">Cloud</button>
      <button class="route" data-route="screen">Screen</button>
    </div>
    <label class="share"><input type="checkbox" id="memoryShare"> Share memory with cloud</label>
    <div class="meta" id="meta"></div>
  </section>

  <script src="logo.js"></script>
  <script src="orb.js"></script>
  <script src="app.js"></script>
</body>
</html>
