# AIR bundle for a profile created from upstream's `headless` template. Add it INSTEAD of
# @air/dsh-air-bundle: that bundle targets rows that only the Web composition has
# (account-controller, ui-settings-account, agent-preset-registry) and keeps the convention
# plugins inside an agent preset, and the headless composition has no preset registry.
# Here every plugin is a root row of the composition, so it applies to the one Agent the
# headless runner creates. Every patch target below exists in dsh-base or dsh-headless.

# Rows that send data to DeepSeek services or depend on a DeepSeek account.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: web-search-deepseek
  disabled: true

# Default model of the one-shot Agent: the 32K variant of qwen3:8b (see ../air/cordis.patch.yml).
# The `ollama` route is declared in the profile patch (../../examples/ollama.profile.cordis.patch.yml).
- id: agent-default-model
  config:
    provider: ollama
    model: qwen3-8b-32k

# User-level skill folders are opt-in, as in the AIR presets; the AIR skill provider owns project roots.
- id: skill-filesystem
  config:
    includeDefaultRoots: false

# A bundle patch cannot change a row's package, so the stock compaction row is turned off and AIR's engine
# (same Config, plus a chronological log in the summary) is inserted below as `air-compaction-log`.
- id: compaction-basic
  disabled: true

# The lean tool set: the tools the `air-lean` preset omits. The headless composition has no schedule
# tool. To get the full set, set `disabled: false` on these rows in the profile patch.
# Keep this list equal to REMOVED_ROW_IDS in air/scripts/gen-preset-air-lean.ts (a test checks it).
- id: command-goal
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

- insert:
    # Compaction thresholds for the local models, lean values (this bundle carries the lean tool set).
    - id: air-compaction-log
      name: '@air/dsh-compaction-log'
      config:
        # BEGIN generated by air/scripts/gen-compaction-policies.ts; edit its table and run pnpm -C air run gen:policies
        modelPolicies:
          - provider: ollama
            model: qwen3-8b-16k
            headroomTokens: 3288
            retainTokens: 800
            maxTokens: 1024
          - provider: ollama
            model: qwen3-8b-32k
            headroomTokens: 8672
            maxTokens: 2048
          - provider: ollama
            model: qwen35-4b-32k
            headroomTokens: 8672
            maxTokens: 2048
          - provider: ollama
            model: qwen35-9b-24k
            headroomTokens: 5980
            maxTokens: 1536
          - provider: ollama
            model: qwen25-7b-32k
            headroomTokens: 8672
            maxTokens: 2048
          - provider: ollama
            model: gemma4-e4b-32k
            headroomTokens: 8672
            maxTokens: 2048
          - provider: ollama
            model: granite42-8b-16k
            headroomTokens: 3288
            retainTokens: 800
            maxTokens: 1024
          - provider: ollama
            model: granite42-3b-32k
            headroomTokens: 8672
            maxTokens: 2048
          - provider: ollama
            model: llama31-8b-16k
            headroomTokens: 3288
            retainTokens: 800
            maxTokens: 1024
        # END generated policies
    - id: air-instruction-conventions
      name: '@air/dsh-instruction-conventions'
      config:
        maxBytes: 32768
    - id: air-skill-conventions
      name: '@air/dsh-skill-conventions'
    - id: air-command-conventions
      name: '@air/dsh-command-conventions'
    - id: air-mcp-conventions
      name: '@air/dsh-mcp-conventions'
      config:
        reviewTools: true
    # Same row as air/bundles/air and air/bundles/mcp-servers (a test keeps them equal). In a headless run
    # nobody can answer the first-use prompt, so an unpinned server stays blocked; pin it beforehand with the
    # `air-mcp` command line.
    - id: air-mcp-trust
      name: '@air/dsh-mcp-trust'
      config:
        lockfile: !!js dshHomePath('air', 'mcp-lock.json')
        auditDir: !!js dshHomePath('air', 'mcp-audit')
        defaults:
          mode: enforce
          onAdded: withhold
          onChanged: reject-generation
          onRemoved: accept
          instructions: pin
        denyUnreviewedMcpTools: true
        maxPromptsPerServer: 2
        minReverifyMs: 60000
        maxReverifyMs: 86400000
        lockWaitMs: 2000
        watchDebounceMs: 200
        cliCommand: pnpm dsh --profile air-mcp
        enrollOnApproval: true
