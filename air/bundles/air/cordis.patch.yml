# AIR product bundle: local-first defaults layered after dsh-base and dsh-web-app.
# Later layers win per row id, so this patch changes upstream rows without
# editing upstream YAML. A patch replaces a row's whole `config`.

# Rows that send data to DeepSeek services or depend on a DeepSeek account.
# `disabled` is row metadata, so a patch can always set it.
- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

# Account Remote and settings page consume the disabled account service.
- id: account-controller
  disabled: true

- id: ui-settings-account
  disabled: true

- id: web-search-deepseek
  disabled: true

# Default model for new Agents: the 32K context variant of qwen3:8b. Plain
# `qwen3:8b` runs at a 4,096-token context in Ollama and truncates the agent
# prompt. The `ollama` route itself is declared in the profile patch (see ../../examples/ollama.profile.cordis.patch.yml), because
# saving any provider in Settings → Models replaces the whole `llm-pi-ai`
# config at the profile layer.
- id: agent-default-model
  config:
    provider: ollama
    model: qwen3-8b-32k

# The AIR agent preset: the upstream `standard` plugin list
# (packages/bundle/web-app/presets/standard.patch.yml) with the AIR convention
# plugins added. A bundle patch cannot reach rows nested in `preset-standard`,
# so AIR ships its own presets; `standard` stays selectable.
# air/scripts/tests/preset-air-drift.spec.ts fails when the two
# lists differ by anything other than the changes below, which is the signal to
# re-copy after an upstream merge.
#   - skill-filesystem: includeDefaultRoots false, so ~/.dsh/skills and
#     ~/.agents/skills are not listed; the AIR provider owns project roots and
#     ~/.air/skills, and user roots are opt-in. Bundled skills stay.
#   - air-skill-conventions and air-instruction-conventions: added.
- insert:
    - id: preset-air
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: air
        name: AIR
        description: Standard coding tools plus Claude Code file conventions; user-level skill folders are opt-in.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: air-instruction-conventions
            name: '@air/dsh-instruction-conventions'
            config:
              maxBytes: 32768
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
          - id: air-skill-conventions
            name: '@air/dsh-skill-conventions'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # BEGIN generated by air/scripts/gen-compaction-policies.ts; edit its table and run pnpm -C air run gen:policies
                  modelPolicies:
                    - provider: ollama
                      model: qwen3-8b-16k
                      headroomTokens: 1288
                      retainTokens: 600
                      maxTokens: 800
                    - provider: ollama
                      model: qwen3-8b-32k
                      headroomTokens: 6672
                      maxTokens: 2048
                    - provider: ollama
                      model: qwen35-4b-32k
                      headroomTokens: 6672
                      maxTokens: 2048
                    - provider: ollama
                      model: qwen35-9b-24k
                      headroomTokens: 4480
                      maxTokens: 1536
                    - provider: ollama
                      model: qwen25-7b-32k
                      headroomTokens: 6672
                      maxTokens: 2048
                    - provider: ollama
                      model: gemma4-e4b-32k
                      headroomTokens: 6672
                      maxTokens: 2048
                    - provider: ollama
                      model: granite42-8b-16k
                      headroomTokens: 1288
                      retainTokens: 600
                      maxTokens: 800
                    - provider: ollama
                      model: granite42-3b-32k
                      headroomTokens: 6672
                      maxTokens: 2048
                    - provider: ollama
                      model: llama31-8b-16k
                      headroomTokens: 1288
                      retainTokens: 600
                      maxTokens: 800
                  # END generated policies
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  toolFilter:
                    deny:
                      - schedule_create
                      - schedule_delete
                      - schedule_list
                      - schedule_update
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  toolFilter:
                    deny:
                      - schedule_create
                      - schedule_delete
                      - schedule_list
                      - schedule_update
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

    # The same plugin list without the tools that cost the most context on a
    # small local window: schedule, delegation (subagents and workflow), and
    # goal. The list between the markers is generated from `preset-air`.
    - id: preset-air-lean
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: air-lean
        name: AIR Lean
        description: Standard coding tools without schedule, delegation, workflow, and goal, for small local context windows.
        order: -1
        plugins:
          # BEGIN generated by air/scripts/gen-preset-air-lean.ts; edit preset-air and run pnpm -C air run gen:lean
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: air-instruction-conventions
            name: '@air/dsh-instruction-conventions'
            config:
              maxBytes: 32768
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
          - id: air-skill-conventions
            name: '@air/dsh-skill-conventions'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # BEGIN generated by air/scripts/gen-compaction-policies.ts; edit its table and run pnpm -C air run gen:policies
                  modelPolicies:
                    - provider: ollama
                      model: qwen3-8b-16k
                      headroomTokens: 3288
                      retainTokens: 800
                      maxTokens: 1024
                    - provider: ollama
                      model: qwen3-8b-32k
                      headroomTokens: 8672
                      maxTokens: 2048
                    - provider: ollama
                      model: qwen35-4b-32k
                      headroomTokens: 8672
                      maxTokens: 2048
                    - provider: ollama
                      model: qwen35-9b-24k
                      headroomTokens: 5980
                      maxTokens: 1536
                    - provider: ollama
                      model: qwen25-7b-32k
                      headroomTokens: 8672
                      maxTokens: 2048
                    - provider: ollama
                      model: gemma4-e4b-32k
                      headroomTokens: 8672
                      maxTokens: 2048
                    - provider: ollama
                      model: granite42-8b-16k
                      headroomTokens: 3288
                      retainTokens: 800
                      maxTokens: 1024
                    - provider: ollama
                      model: granite42-3b-32k
                      headroomTokens: 8672
                      maxTokens: 2048
                    - provider: ollama
                      model: llama31-8b-16k
                      headroomTokens: 3288
                      retainTokens: 800
                      maxTokens: 1024
                  # END generated policies
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # END generated

    # Host rows: each mounts per-Agent children through createScope.
    - id: air-mcp-conventions
      name: '@air/dsh-mcp-conventions'
      config:
        # Every .mcp.json server waits for the MCP tool reviewer, so its tool
        # definitions are reviewed before any of them reaches a model.
        reviewTools: true
    # Same row as air/bundles/mcp-servers (a test keeps them equal). Mode
    # `enforce`: a server with no pin registers nothing until the first-use
    # prompt is allowed or `air-mcp pin` runs. Lockfile and audit directory
    # sit under the harness home, shared with the `air-mcp` profile.
    - id: air-mcp-trust
      name: '@air/dsh-mcp-trust'
      config:
        lockfile: !!js dshHomePath('air', 'mcp-lock.json')
        auditDir: !!js dshHomePath('air', 'mcp-audit')
        defaults:
          mode: enforce
          onAdded: withhold
          onChanged: reject-generation
          onRemoved: accept
          instructions: pin
        denyUnreviewedMcpTools: true
        maxPromptsPerServer: 2
        minReverifyMs: 60000
        maxReverifyMs: 86400000
        lockWaitMs: 2000
        watchDebounceMs: 200
        cliCommand: pnpm dsh --profile air-mcp
        enrollOnApproval: true
    - id: air-command-conventions
      name: '@air/dsh-command-conventions'
    # Picks air-lean or air for a new session from the selected model's context window. It needs the
    # `agent-preset-registry` row below only as a service, so row order does not matter.
    - id: air-preset-by-model
      name: '@air/dsh-preset-by-model'
      config:
        enabled: true
        smallWindowTokens: 65536
        smallPreset: air-lean
        largePreset: air
    # Keeps a reasoning-effort pick in the session: picking a model still saves provider and model as the
    # default, but the effort stays whatever the agent-default-model row (or the provider) says.
    - id: air-effort-session-only
      name: '@air/dsh-effort-session-only'
      config:
        enabled: true

# New sessions use the lean AIR preset; the full one stays selectable. The registry row's only non-volatile Config
# field is `default`, so replacing its config loses nothing.
- id: agent-preset-registry
  config:
    default: air-lean
