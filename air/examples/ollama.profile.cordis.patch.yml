# Copy into $DSH_HOME/profiles/air/cordis.patch.yml.
# Declares a local Ollama route through the pi-ai provider. Ollama ignores the
# key, but a named `apiKeyEnv` that resolves to a non-empty value avoids pi-ai's
# ambient key discovery, which is only defined for catalog providers. Put
# `OLLAMA_API_KEY=ollama` in $DSH_HOME/.env.
# Ollama runs a model at a 4,096-token context unless the model sets num_ctx, and it
# truncates the larger agent request without an error. The model id below is a variant
# with num_ctx 16384; create it once as described in air/README.md, and keep
# contextWindow equal to that num_ctx.
# Thinking is off by default for the Qwen 3 model. With thinking on, Qwen 3 emits a stray
# `/think` on short prompts and spends seconds reasoning before a short reply; with
# `reasoning: off` the request sends `reasoning_effort: none` and short replies took about
# 0.4 s instead of 2.6 to 4.4 s in one test. `supportsReasoningEffort` makes the route send the
# field, and `reasoningEfforts` maps the app's effort levels to Ollama's wire values. Choosing
# "medium" in the app's effort control turns thinking on for that session.

- id: llm-pi-ai
  config:
    providers:
      ollama:
        displayName: Ollama (local)
        apiKeyEnv: OLLAMA_API_KEY
        reasoning: 'off'
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: qwen3-8b-16k
            contextWindow: 16384
            maxTokens: 4096
            compat:
              supportsReasoningEffort: true
            reasoningEfforts:
              'off': none
              medium: medium

- id: agent-default-model
  config:
    provider: ollama
    model: qwen3-8b-16k
